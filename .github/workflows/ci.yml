name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Install src-panel deps (standalone npm package, not in pnpm workspace)
        run: |
          cd packages/tray-app/src-panel
          npm ci
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm test
